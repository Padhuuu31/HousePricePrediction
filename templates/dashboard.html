<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f7fc;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#1565c0;
            margin-bottom:30px;
        }

        .back-btn{
            display:inline-block;
            margin-bottom:25px;
            padding:10px 20px;
            background:#1565c0;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }

        .back-btn:hover{
            background:#0d47a1;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:35px;
        }

        .card{
            background:white;
            border-radius:12px;
            padding:25px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        .card h2{
            color:#1565c0;
            margin-bottom:10px;
        }

        .card h1{
            color:#333;
            font-size:30px;
        }

        .chart-box{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }
    </style>

</head>

<body>

<a href="/" class="back-btn">← Back to Home</a>

<h1>📊 House Price Analytics Dashboard</h1>

<div class="cards">

    <div class="card">
        <h2>Total Predictions</h2>
        <h1>{{ total }}</h1>
    </div>

    <div class="card">
        <h2>Average Price</h2>
        <h1>₹ {{ "{:,.0f}".format(avg_price) }}</h1>
    </div>

    <div class="card">
        <h2>Highest Price</h2>
        <h1>₹ {{ "{:,.0f}".format(max_price) }}</h1>
    </div>

    <div class="card">
        <h2>Lowest Price</h2>
        <h1>₹ {{ "{:,.0f}".format(min_price) }}</h1>
    </div>

</div>

<div class="chart-box">
    <canvas id="priceChart"></canvas>
</div>

<script>

const labels = {{ labels|tojson }};
const prices = {{ prices|tojson }};

const ctx = document.getElementById("priceChart").getContext("2d");

new Chart(ctx, {
    type: "bar",
    data: {
        labels: labels,
        datasets: [{
            label: "Predicted House Price",
            data: prices,
            backgroundColor: "rgba(25,118,210,0.7)",
            borderColor: "rgba(13,71,161,1)",
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                display: true
            },
            title: {
                display: true,
                text: "House Price Predictions"
            }
        },
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});

</script>

</body>
</html>
