<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f7fa;
            margin:40px;
        }

        h1{
            text-align:center;
            color:#1565c0;
        }

        table{

            width:100%;

            border-collapse:collapse;

            background:white;

            box-shadow:0 5px 20px rgba(0,0,0,.15);

        }

        th{

            background:#1565c0;

            color:white;

            padding:15px;

        }

        td{

            padding:12px;

            text-align:center;

            border-bottom:1px solid #ddd;

        }

        tr:hover{

            background:#f1f1f1;

        }

    </style>

</head>

<body>

<h1>📋 Prediction History</h1>

<table>

<tr>

<th>ID</th>
<th>Bedrooms</th>
<th>Bathrooms</th>
<th>Living Area</th>
<th>Predicted Price</th>
<th>Date</th>

</tr>

{% for row in rows %}

<tr>

<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
<td>{{row[3]}}</td>
<td>₹ {{ "{:,.2f}".format(row[13]) }}</td>
<td>{{row[14]}}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
